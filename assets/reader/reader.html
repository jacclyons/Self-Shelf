<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Self-Shelf Reader</title>
<style>
  :root {
    --bg: #F7F3EC;
    --fg: #181513;
    --accent: #8B4FD1;
    --margin: 28px;
    --top: 0px;
    --bottom: 0px;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--fg);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font: 15px/1.4 -apple-system, system-ui, sans-serif;
  }
  #stage { position: absolute; inset: 0; }

  /* ---------------- EPUB ---------------- */
  #epub {
    position: absolute; inset: 0;
    box-sizing: border-box;
    /* Safe area + reader chrome are reserved here, not in JS, so the text can
       never end up under the status bar while epub.js is still starting up. */
    padding: var(--top) var(--margin) var(--bottom);
  }

  /* --------- Paged media: PDF + comics --------- */
  #pages {
    position: absolute; inset: 0;
    display: none;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
  }
  #pages.scroll {
    overflow-x: hidden; overflow-y: auto;
    scroll-snap-type: none;
    white-space: normal;
  }
  .page {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 100vw; height: 100%;
    scroll-snap-align: center; scroll-snap-stop: always;
    vertical-align: top;
    box-sizing: border-box;
    padding: calc(var(--top) + 8px) 10px calc(var(--bottom) + 8px);
  }
  #pages.scroll .page {
    display: flex; width: 100%; height: auto;
    padding: 6px 8px;
  }
  #pages.zoomed { scroll-snap-type: none; overflow: hidden; }
  .page canvas, .page img {
    max-width: 100%; max-height: 100%;
    transform-origin: center center;
    will-change: transform;
    border-radius: 3px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.16);
    background: #fff;
  }
  .page.dim canvas, .page.dim img { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.92); }
  .page-notice { white-space: normal; text-align: center; max-width: 280px; padding: 24px; opacity: 0.7; }
  #pages.scroll .page.comic:not([data-loaded="1"]) { min-height: 60vh; }

  /* --------------- status --------------- */
  #status {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    text-align: center; padding: 40px;
    color: var(--fg);
  }
  #status.on { display: flex; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--fg) 18%, transparent);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #statusText { opacity: 0.6; font-size: 14px; max-width: 260px; }
</style>
</head>
<body>
<div id="stage">
  <div id="epub"></div>
  <div id="pages"></div>
</div>
<div id="status" class="on"><div class="spinner"></div><div id="statusText">Opening…</div></div>

<script src="jszip.js"></script>
<script src="epub.js"></script>
<script src="pdf.js"></script>

<script>
(function () {
  'use strict';

  /* On iOS the host is a WKWebView; on web it is a same-origin iframe, which
     reaches its host with postMessage instead. Both speak the same JSON. */
  var RN = window.ReactNativeWebView || (window.parent !== window ? {
    postMessage: function (payload) { window.parent.postMessage(payload, '*'); }
  } : null);
  function post(msg) { try { RN && RN.postMessage(JSON.stringify(msg)); } catch (e) {} }
  var fatalError = false;
  function fail(message) {
    if (fatalError || disposed) return;
    fatalError = true;
    stopComicWorker();
    setStatus(managedLoading ? '' : message, false);
    post({ type: 'error', message: String(message) });
  }
  function setStatus(text, spinning) {
    var el = document.getElementById('status');
    document.getElementById('statusText').textContent = text || '';
    el.querySelector('.spinner').style.display = spinning === false ? 'none' : '';
    el.classList.toggle('on', !!text);
  }

  /* Read a same-origin file:// resource. WKWebView's fetch() refuses file URLs,
     and file:// XHR reports HTTP status 0 on success, so handle both here. */
  var managedLoading = false;
  var comicWorker = null;
  var comicWorkerUrl = null;
  var disposed = false;
  var requests = new Set();

  /** The host keeps Close available; standalone readers retain their own status. */
  function loading(stage, detail) {
    var message = Object.assign({ type: 'loading', stage: stage }, detail || {});
    post(message);
    if (!managedLoading && !state.opened && !fatalError) {
      var labels = { download: 'Downloading book…', reading: 'Reading file…', unpacking: 'Unpacking images…', rendering: 'Preparing visible page…' };
      setStatus(labels[stage] + (message.fraction != null ? ' ' + Math.round(message.fraction * 100) + '%' : ''), true);
    }
  }

  function stopComicWorker() {
    if (comicWorker) comicWorker.terminate();
    if (comicWorkerUrl) URL.revokeObjectURL(comicWorkerUrl);
    comicWorker = null;
    comicWorkerUrl = null;
  }

  function disposeReader() {
    disposed = true;
    stopComicWorker();
    requests.forEach(function (xhr) { xhr.abort(); });
    requests.clear();
  }
  window.addEventListener('pagehide', disposeReader);

  function readBinary(url, reportProgress) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      requests.add(xhr);
      xhr.onloadend = function () { requests.delete(xhr); };
      xhr.onabort = function () { reject(new Error('Opening cancelled.')); };
      if (reportProgress) {
        var stage = /^https?:/i.test(url) ? 'download' : 'reading';
        loading(stage);
        var lastUpdate = 0;
        xhr.onprogress = function (event) {
          var now = Date.now();
          if (now - lastUpdate < 120 && event.loaded !== event.total) return;
          lastUpdate = now;
          loading(stage, {
            bytes: event.loaded,
            fraction: event.lengthComputable && event.total > 0 ? Math.min(1, event.loaded / event.total) : undefined,
          });
        };
      }
      xhr.onload = function () {
        if ((xhr.status === 200 || xhr.status === 0) && xhr.response) resolve(xhr.response);
        else reject(new Error('Could not read the book file (' + xhr.status + ').'));
      };
      xhr.onerror = function () { reject(new Error('Could not read the book file.')); };
      xhr.send();
    });
  }
  function readText(url) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      requests.add(xhr);
      xhr.onloadend = function () { requests.delete(xhr); };
      xhr.onabort = function () { reject(new Error('Opening cancelled.')); };
      xhr.onload = function () {
        if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText) resolve(xhr.responseText);
        else reject(new Error('The reader decoder could not be loaded. Please try again.'));
      };
      xhr.onerror = function () { reject(new Error('The reader decoder could not be loaded. Please try again.')); };
      xhr.send();
    });
  }

  var state = {
    kind: null,
    opened: false,
    settings: {},
    theme: {},
    book: null,
    rendition: null,
    locationsReady: false,
    pdf: null,
    comicEntries: [],
    pageCount: 0,
    pdfPages: [],
    pdfPage: 1,
    pdfScale: 1,
    rendered: {},
    lastPercent: 0,
    lastLocation: null,
    chapters: [],
    highlights: {},     // cfi → { id, color }, so marks can be redrawn for a new theme
    lastSelection: null, // the selection epub.js last reported, as { text, location }
  };

  /* ------------------------------------------------------------------ */
  /* Shared gestures: tap zones                                          */
  /* ------------------------------------------------------------------ */

  var TAP_SLOP = 14;
  var TAP_MS = 500;
  /* A swipe has to start moving well before a long press would begin
     selecting text, so a slow drag after a press is left to the selection. */
  var SWIPE_START_MS = 350;
  /* Release faster than this (px per ms) and the page turns however short the
     drag; slower, and it has to cover this fraction of the page. */
  var SWIPE_VELOCITY = 0.3;
  var SWIPE_FRACTION = 0.2;

  /* Thirds, the full height of the screen: the left third turns back, the
     right third turns forward and the middle third toggles the controls.
     Swipes on books are handled by the page drag below; PDFs and comics
     page with CSS scroll-snap on #pages. */
  function zoneFor(x) {
    var w = window.innerWidth;
    if (x < w / 3) return 'left';
    if (x > w * 2 / 3) return 'right';
    return 'center';
  }

  /** Absolute viewport position, translating out of an iframe's own coordinate space. */
  function viewportPoint(point, doc) {
    var x = point.clientX, y = point.clientY;
    try {
      var frame = doc.defaultView.frameElement;
      if (frame) {
        var rect = frame.getBoundingClientRect();
        x += rect.left;
        y += rect.top;
      }
    } catch (e) { /* cross-origin frame: the raw coordinate is the best we have */ }
    // A touch is always on screen. Deep into a chapter the frame starts
    // thousands of pixels to the left, so if WebKit ever reports the touch in
    // the top window's coordinates the sum lands far off screen and every tap
    // would read as "left". The raw value is the right one in that case.
    if (x < 0 || x > window.innerWidth) x = point.clientX;
    if (y < 0 || y > window.innerHeight) y = point.clientY;
    return { x: x, y: y };
  }

  function hasSelection(doc) {
    try {
      var sel = doc.getSelection();
      return !!(sel && !sel.isCollapsed && String(sel));
    } catch (e) { return false; }
  }

  /** -1 back, 1 forward, 0 stay, for a horizontal release. Finger left is forward. */
  function swipeDirection(dx, velocity, pageWidth) {
    var dir = 0;
    if (Math.abs(velocity) > SWIPE_VELOCITY && (velocity < 0) === (dx < 0)) dir = dx < 0 ? 1 : -1;
    else if (Math.abs(dx) > pageWidth * SWIPE_FRACTION) dir = dx < 0 ? 1 : -1;
    return dir;
  }

  /* ------------------------------------------------------------------ */
  /* EPUB page drag                                                      */
  /* ------------------------------------------------------------------ */

  /* epub.js lays each chapter out as columns and pages by scrolling its
     container sideways. Swipes used to rely on its `snap` helper, which
     listened inside the chapter frames, where iOS delivered nothing until
     they allowed scripts (see disarmChapter), and which also undid tap
     turns: it snaps to a scroll position it only caches on scroll events, so
     a tap that had just turned the page was pulled straight back. The page follows the finger
     from here instead, then eases onto the nearest page. */
  var pageDrag = { start: 0, anim: 0, target: null, done: null };

  function epubManager() {
    var m = state.kind === 'epub' && state.rendition && state.rendition.manager;
    return m && m.container && m.layout && m.layout.delta ? m : null;
  }

  /** Stop a settle in progress, landing on its page so the next turn starts aligned. */
  function settlePageDrag() {
    if (!pageDrag.anim) return;
    cancelAnimationFrame(pageDrag.anim);
    pageDrag.anim = 0;
    var m = epubManager();
    if (m && pageDrag.target != null) m.container.scrollLeft = pageDrag.target;
    var done = pageDrag.done;
    pageDrag.target = null;
    pageDrag.done = null;
    if (done) done();
  }

  function animatePageTo(el, to, done) {
    var from = el.scrollLeft;
    // Quicker for the last few pixels of a long drag than for a whole page.
    var ms = Math.max(140, Math.min(300, Math.abs(to - from) * 0.75));
    var t0 = performance.now();
    pageDrag.target = to;
    pageDrag.done = done || null;
    function step(now) {
      var p = Math.min(1, (now - t0) / ms);
      var eased = 1 - Math.pow(1 - p, 3);
      el.scrollLeft = from + (to - from) * eased;
      if (p < 1) { pageDrag.anim = requestAnimationFrame(step); return; }
      pageDrag.anim = 0;
      pageDrag.target = null;
      pageDrag.done = null;
      if (done) done();
    }
    pageDrag.anim = requestAnimationFrame(step);
  }

  /** False when the page can't follow the finger; the swipe then just turns on release. */
  function beginPageDrag() {
    var m = epubManager();
    // Right-to-left books scroll negatively, and differently per engine.
    if (!m || m.settings.direction === 'rtl') return false;
    settlePageDrag();
    pageDrag.start = m.container.scrollLeft;
    return true;
  }

  function movePageDrag(dx) {
    var m = epubManager();
    if (!m) return;
    var el = m.container;
    el.scrollLeft = Math.max(0, Math.min(el.scrollWidth - el.clientWidth, pageDrag.start - dx));
  }

  function endPageDrag(dx, velocity) {
    var m = epubManager();
    if (!m) return;
    var el = m.container;
    var delta = m.layout.delta;
    var dir = swipeDirection(dx, velocity, delta);
    var base = Math.round(pageDrag.start / delta) * delta;
    var target = base + dir * delta;
    if (dir) post({ type: 'tap', zone: dir > 0 ? 'right' : 'left' });
    if (target < 0 || target > el.scrollWidth - el.clientWidth + 1) {
      // The neighbouring chapter isn't laid out yet (or this is the end of
      // the book): settle back and let epub.js load it, as a tap would.
      animatePageTo(el, base, dir ? function () { turn(dir); } : null);
      return;
    }
    animatePageTo(el, target);
  }

  /* Taps arrive from several places: each chapter iframe, the padded container
     around them (the safe-area insets leave a lot of that), and WebKit's
     synthetic mouse events and click after a touch. They all funnel through
     here and are de-duplicated by time. */
  var lastTapAt = 0;
  var lastTouchTapAt = 0;

  function handleTap(x, opts, fromTouch) {
    // Only suppress the synthetic click WebKit fires after a touch — tapping
    // the page-turn zone repeatedly must stay as fast as the reader wants.
    var now = Date.now();
    if (fromTouch) lastTouchTapAt = now;
    else if (now - lastTouchTapAt < 700) return;

    // Two listeners seeing the same gesture must still turn only one page;
    // 80ms is far below a human double-tap but above any bubbling duplicate.
    if (now - lastTapAt < 80) return;
    lastTapAt = now;

    var zone = zoneFor(x);
    if (zone === 'center') { post({ type: 'tap', zone: 'center' }); return; }
    // Left-hand mode mirrors the zones so the thumb's side turns forward.
    var forward = zone === (state.settings.leftHanded ? 'left' : 'right');
    if (opts && opts.onTurn) opts.onTurn(forward ? 1 : -1);
    post({ type: 'tap', zone: zone });
  }

  /* A tap while text is selected never turns the page or toggles the controls.
     Tapping the selection itself is left to WebKit, which re-opens its menu;
     anywhere else clears it, so a selection can't get stuck and swallow every
     tap after it. */
  function dismissSelection(doc, point) {
    try {
      var sel = doc.getSelection();
      if (!sel || sel.isCollapsed || !String(sel)) return false;
      var box = sel.rangeCount ? sel.getRangeAt(0).getBoundingClientRect() : null;
      var pad = 24;
      if (box && point.clientX >= box.left - pad && point.clientX <= box.right + pad &&
          point.clientY >= box.top - pad && point.clientY <= box.bottom + pad) return true;
      sel.removeAllRanges();
      return true;
    } catch (e) { return false; }
  }

  /**
   * Recognise taps anywhere in one document. Listeners sit on the document in
   * the capture phase so nothing inside can keep a tap from us, and every
   * input path WebKit might take is covered (touch, the mouse events it
   * synthesises after a touch, and click), because iOS is not consistent
   * about which of them reach a sandboxed chapter frame. A tap needs no
   * matching start event: an end that arrives on its own still counts unless
   * a drag, pinch or cancelled touch has only just finished.
   */
  function attachTaps(doc, opts) {
    var press = null;   // the single-finger touch or mouse press in flight
    var fingers = 0;    // touches currently down; more than one is never a tap
    var movedAt = 0;    // when a press last ended as a drag, pinch or cancel

    /* Movement is measured in viewport coordinates, re-read on every event:
       a chapter frame slides under the finger while the page follows it,
       which would skew anything measured inside the frame. (epub.js used
       Touch.screenX for this, which isn't something to lean on either.) */
    function begin(point, touch) {
      var now = Date.now();
      var at = viewportPoint(point, doc);
      press = {
        x: at.x, y: at.y, t: now, moved: false, touch: touch,
        swipe: false, drag: false, lastX: at.x, lastT: now, velocity: 0,
      };
    }
    function move(point) {
      if (!press) return;
      var at = viewportPoint(point, doc);
      var dx = at.x - press.x;
      var dy = at.y - press.y;
      if (press.swipe) {
        var now = Date.now();
        var dt = now - press.lastT;
        // Weighted towards the latest movement, so a flick that slows before
        // lifting doesn't count as fast.
        if (dt > 0) press.velocity = 0.7 * ((at.x - press.lastX) / dt) + 0.3 * press.velocity;
        press.lastX = at.x;
        press.lastT = now;
        if (press.drag) movePageDrag(dx);
        return;
      }
      if (press.moved || (Math.abs(dx) <= TAP_SLOP && Math.abs(dy) <= TAP_SLOP)) return;
      press.moved = true;
      movedAt = Date.now();
      // A prompt sideways drag on a book turns the page. A slow one, a
      // vertical one, or one with text selected belongs to WebKit.
      if (press.touch && state.kind === 'epub' && Math.abs(dx) > Math.abs(dy) &&
          Date.now() - press.t < SWIPE_START_MS && !hasSelection(doc)) {
        press.swipe = true;
        press.drag = beginPageDrag();
        if (press.drag) movePageDrag(dx);
      }
    }
    /** Finish a swipe: settle the dragged page, or turn if it couldn't follow. */
    function release(was, point) {
      movedAt = Date.now();
      var dx = point ? viewportPoint(point, doc).x - was.x : 0;
      var velocity = point ? was.velocity : 0;
      if (was.drag) { endPageDrag(dx, velocity); return; }
      var dir = swipeDirection(dx, velocity, window.innerWidth);
      // Right-to-left books turn forward with a swipe to the right.
      var rtl = state.rendition && state.rendition.settings && state.rendition.settings.direction === 'rtl';
      if (dir) turn(rtl ? -dir : dir);
    }
    function drop() {
      if (press && press.swipe) release(press, null);
      press = null;
      movedAt = Date.now();
    }
    function end(point, touch) {
      var was = press;
      press = null;
      if (was && was.swipe) { release(was, point); return; }
      if (was && (was.moved || Date.now() - was.t > TAP_MS)) return;
      if (!was && Date.now() - movedAt < 500) return;
      if (dismissSelection(doc, point)) return;
      handleTap(viewportPoint(point, doc).x, opts, touch);
    }
    // A tap on a footnote or chapter link follows the link; it isn't a page turn.
    function onLink(e) {
      var el = e.target;
      return !!(el && el.closest && el.closest('a[href]'));
    }

    var passive = { capture: true, passive: true };
    doc.addEventListener('touchstart', function (e) {
      fingers = e.touches.length;
      if (fingers === 1) begin(e.touches[0], true); else drop();
    }, passive);
    doc.addEventListener('touchmove', function (e) {
      if (e.touches.length === 1) move(e.touches[0]);
    }, passive);
    doc.addEventListener('touchend', function (e) {
      if (e.touches.length) return;
      var multi = fingers > 1;
      fingers = 0;
      if (multi) drop();
      else if (press && press.swipe) end(e.changedTouches[0], true);
      else if (onLink(e)) press = null;
      else end(e.changedTouches[0], true);
    }, passive);
    doc.addEventListener('touchcancel', function () {
      fingers = 0;
      drop();
    }, passive);

    doc.addEventListener('mousedown', function (e) {
      if (e.button === 0) begin(e, false);
    }, true);
    doc.addEventListener('mousemove', function (e) {
      if (e.buttons) move(e);
    }, true);
    doc.addEventListener('click', function (e) {
      if (e.button !== 0) return;
      if (onLink(e)) press = null;
      else end(e, false);
    }, true);
  }

  /* ------------------------------------------------------------------ */
  /* EPUB                                                                */
  /* ------------------------------------------------------------------ */

  function epubThemeRules() {
    var s = state.settings, t = state.theme;
    return {
      'html, body': { background: t.bg + ' !important' },
      body: {
        color: t.fg + ' !important',
        'font-family': s.fontFamily === 'publisher' ? null : s.fontFamily + ' !important',
        'font-weight': t.bold ? '600' : null,
        'line-height': s.lineHeight + ' !important',
        'text-align': s.justify ? 'justify' : 'start',
        '-webkit-hyphens': s.justify ? 'auto' : 'manual',
        hyphens: s.justify ? 'auto' : 'manual',
        padding: '0 !important',
      },
      'p, li, div, span': {
        'line-height': s.lineHeight + ' !important',
        'font-weight': t.bold ? '600' : null,
      },
      'h1, h2, h3, h4, h5, h6': { color: t.fg + ' !important' },
      a: { color: t.accent + ' !important', 'text-decoration': 'none' },
      img: { 'max-width': '100% !important', height: 'auto !important' },
      '::selection': { background: 'color-mix(in srgb, ' + t.accent + ' 32%, transparent)' },
    };
  }

  function applyEpubStyle() {
    if (!state.rendition) return;
    var r = state.rendition;
    r.themes.register('self-shelf', epubThemeRules());
    r.themes.select('self-shelf');
    r.themes.fontSize(state.settings.fontSize + '%');
    if (state.settings.fontFamily && state.settings.fontFamily !== 'publisher') {
      r.themes.font(state.settings.fontFamily);
    }
  }

  /* Marks are SVG rects laid over the chapter. `multiply` tints the paper
     under the text on a light theme, but multiplying anything into a near-
     black page gives near-black, so on dark themes the same mark is invisible
     and the text is left barely tinted. `screen` is the mirror image: it
     lifts the dark page to the highlight colour and leaves light text alone. */
  function drawHighlight(id, cfi, color) {
    try {
      state.rendition.annotations.highlight(cfi, { id: id }, null, 'jf-hl', {
        fill: color,
        'fill-opacity': state.theme.dark ? '0.45' : '0.32',
        'mix-blend-mode': state.theme.dark ? 'screen' : 'multiply',
      });
    } catch (e) {}
  }

  /* The live selection in whichever chapter frame has one, as text plus a
     CFI. epub.js reports selections through a debounced selectionchange
     listener, which is fine for showing a menu but a poor thing to act on
     later: the menu tap can land before the debounce fires, and a frame
     can be torn down in between. Reading the frames at the moment of the
     tap is what the highlight actually wants. */
  function currentSelection() {
    if (!state.rendition) return null;
    var found = null;
    try {
      state.rendition.getContents().forEach(function (c) {
        if (found) return;
        var sel = c.window.getSelection();
        if (!sel || !sel.rangeCount || sel.isCollapsed) return;
        var text = String(sel).trim();
        if (!text) return;
        found = { text: text, location: c.cfiFromRange(sel.getRangeAt(0)) };
      });
    } catch (e) {
      post({ type: 'log', message: 'selection failed: ' + (e && e.message ? e.message : e) });
    }
    return found;
  }

  function redrawHighlights() {
    if (!state.rendition) return;
    Object.keys(state.highlights).forEach(function (cfi) {
      var mark = state.highlights[cfi];
      try { state.rendition.annotations.remove(cfi, 'highlight'); } catch (e) {}
      drawHighlight(mark.id, cfi, mark.color);
    });
  }

  /* Keyboard paging. A browser reader is expected to answer the arrow keys,
     and epub.js paints each chapter into its own iframe, so the listener has
     to be attached per-document rather than once on the window. Harmless on
     iOS, where it only ever fires for an attached keyboard. */
  function bindKeys(doc) {
    doc.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var key = e.key;
      var handled = true;

      if (key === 'ArrowRight' || key === 'PageDown') turn(1);
      else if (key === 'ArrowLeft' || key === 'PageUp') turn(-1);
      else if (key === ' ' || key === 'Spacebar') turn(e.shiftKey ? -1 : 1);
      else if (key === 'Escape') post({ type: 'dismiss' });
      else handled = false;

      if (handled) { e.preventDefault(); e.stopPropagation(); }
    });
  }

  function bindContents(contents) {
    var doc = contents.document;
    attachTaps(doc, { onTurn: turn });
    bindKeys(doc);
    // Long-press selection needs text selection enabled inside the frame.
    contents.addStylesheetRules({ 'body': { '-webkit-user-select': 'text', 'user-select': 'text' } });
    // iOS only delivers click to content it considers clickable, and a pointer
    // cursor is the documented way to opt a whole page in. Scoped to touch
    // screens, which never draw the cursor, so the web build keeps its I-beam.
    try {
      var style = doc.createElement('style');
      style.textContent = '@media (pointer: coarse) { html, body { cursor: pointer; } }';
      doc.head.appendChild(style);
    } catch (e) {}
  }

  function reportEpubLocation() {
    var r = state.rendition;
    if (!r || !r.currentLocation) return;
    var loc = r.currentLocation();
    if (!loc || !loc.start) return;

    var cfi = loc.start.cfi;
    var percent = 0;
    if (state.locationsReady && state.book.locations && state.book.locations.length()) {
      percent = state.book.locations.percentageFromCfi(cfi) || 0;
    } else if (loc.start.percentage) {
      percent = loc.start.percentage;
    }

    var chapter = null;
    try {
      var nav = state.book.navigation && state.book.navigation.get(loc.start.href);
      chapter = nav ? nav.label.trim() : null;
    } catch (e) {}
    if (!chapter) {
      // navigation.get() is keyed by the raw TOC hrefs; the resolved list is
      // keyed the way the spine is, which is what the location reports.
      for (var i = 0; i < state.chapters.length; i++) {
        var href = state.chapters[i].href;
        if (href && href.split('#')[0] === loc.start.href) { chapter = state.chapters[i].label; break; }
      }
    }

    state.lastPercent = percent;
    state.lastLocation = cfi;

    post({
      type: 'location',
      percent: percent,
      location: cfi,
      chapter: chapter,
      page: loc.start.displayed ? loc.start.displayed.page : null,
      pagesInChapter: loc.start.displayed ? loc.start.displayed.total : null,
      atStart: !!loc.atStart,
      atEnd: !!loc.atEnd,
    });
  }

  /* epub.js keeps TOC hrefs exactly as the nav document wrote them, but
     rendition.display() only understands hrefs relative to the OPF, so a book
     whose nav.xhtml sits in a subfolder (Sigil puts it in Text/) or that writes
     "../Text/ch1.xhtml" gets a silent "No Section Found" for every entry. This
     resolves each entry against the nav document's own location and hands
     back the spine item's href, which display() does understand. */
  function tocResolver(book) {
    var pkg = book.packaging || {};
    var byPath = {};
    function normalise(path, base) {
      try {
        var out = new URL(path, 'http://x' + (base || '/')).pathname;
        try { out = decodeURIComponent(out); } catch (e) {}
        return out;
      } catch (e) { return path; }
    }
    (book.spine && book.spine.spineItems || []).forEach(function (item) {
      byPath[normalise(book.resolve(item.href))] = item.href;
    });
    var navBase = normalise(book.resolve(pkg.navPath || pkg.ncxPath || '') || '/');
    return function (href) {
      if (!href) return null;
      var hash = href.indexOf('#');
      var path = hash < 0 ? href : href.slice(0, hash);
      var fragment = hash < 0 ? '' : href.slice(hash);
      if (!path) return null;
      var spineHref = byPath[normalise(path, navBase)];
      if (spineHref) return spineHref + fragment;
      // Already an OPF-relative href: leave it alone rather than lose the entry.
      return book.spine && book.spine.get(path) ? href : null;
    };
  }

  function flattenToc(items, depth, out, resolve) {
    (items || []).forEach(function (item) {
      var href = resolve ? resolve(item.href) : item.href;
      out.push({ label: (item.label || '').trim(), href: href, depth: depth });
      if (item.subitems && item.subitems.length) flattenToc(item.subitems, depth + 1, out, resolve);
    });
    return out;
  }

  /* Chapter frames have to allow scripts, or WebKit never runs the tap and
     swipe listeners this page attaches inside them: in a frame sandboxed
     without allow-scripts, every event on the text went unheard and only the
     padding around it responded. Allowing scripts must not let the book run
     its own, so each chapter is disarmed before it is serialised into the
     frame: scripts and inline handlers are removed, and a CSP forbids any
     script that gets past that. Listeners added from this page are unaffected,
     because CSP governs what the frame's document loads, not calls into it. */
  var XHTML_NS = 'http://www.w3.org/1999/xhtml';
  function disarmChapter(doc) {
    try {
      Array.prototype.slice.call(doc.getElementsByTagNameNS('*', 'script')).forEach(function (el) {
        el.parentNode.removeChild(el);
      });
      Array.prototype.slice.call(doc.getElementsByTagName('*')).forEach(function (el) {
        Array.prototype.slice.call(el.attributes).forEach(function (attr) {
          var name = attr.name.toLowerCase();
          if (name.indexOf('on') === 0 ||
              (/(^|:)href$|^src$|^action$/.test(name) && /^\s*javascript:/i.test(attr.value))) {
            el.removeAttributeNode(attr);
          }
        });
      });
      var root = doc.documentElement;
      var head = doc.getElementsByTagName('head')[0];
      if (!head) {
        head = doc.createElementNS(root.namespaceURI || XHTML_NS, 'head');
        root.insertBefore(head, root.firstChild);
      }
      var csp = doc.createElementNS(root.namespaceURI || XHTML_NS, 'meta');
      csp.setAttribute('http-equiv', 'Content-Security-Policy');
      csp.setAttribute('content', "script-src 'none'; object-src 'none'");
      head.insertBefore(csp, head.firstChild);
    } catch (e) {
      post({ type: 'log', message: 'disarm failed: ' + (e && e.message ? e.message : e) });
    }
  }

  async function loadEpub(opts) {
    var data = await readBinary(opts.url, true);
    loading('rendering');
    var book = ePub(data);
    state.book = book;

    await book.ready;
    book.spine.hooks.content.register(disarmChapter);

    var rendition = book.renderTo('epub', {
      manager: 'continuous',
      flow: 'paginated',
      width: '100%',
      height: '100%',
      spread: 'none',
      allowScriptedContent: true,
    });
    state.rendition = rendition;

    rendition.hooks.content.register(bindContents);
    rendition.on('relocated', reportEpubLocation);
    rendition.on('selected', function (cfiRange, contents) {
      var sel = contents.window.getSelection();
      var text = sel ? String(sel).trim() : '';
      if (!text) return;
      state.lastSelection = { text: text, location: cfiRange };
      post({ type: 'selection', text: text, location: cfiRange });
    });

    applyEpubStyle();
    setMargins();

    await rendition.display(opts.location || undefined);
    // The container was padded before the manager existed, so take the size again.
    setMargins();

    state.chapters = flattenToc(book.navigation && book.navigation.toc, 0, [], tocResolver(book));
    state.opened = true;
    post({
      type: 'loaded',
      kind: 'epub',
      title: book.packaging.metadata.title,
      author: book.packaging.metadata.creator,
      chapters: state.chapters,
    });
    setStatus('', true);
    document.getElementById('status').classList.remove('on');

    // Location generation is the expensive part; reuse the cached map when we have one.
    (async function () {
      try {
        if (opts.locations) {
          book.locations.load(opts.locations);
        } else {
          await book.locations.generate(1024);
          post({ type: 'locations', data: book.locations.save() });
        }
        state.locationsReady = true;
        post({ type: 'totalLocations', total: book.locations.length() });
        reportEpubLocation();
      } catch (e) { /* percentages fall back to per-chapter estimates */ }
    })();
  }

  function setMargins() {
    var root = document.documentElement.style;
    root.setProperty('--margin', (state.settings.margin || 24) + 'px');
    root.setProperty('--top', (state.settings.insetTop || 0) + 'px');
    root.setProperty('--bottom', (state.settings.insetBottom || 0) + 'px');
    // The manager only exists once epub.js has started; resizing is the part
    // that has to wait, not the padding itself.
    if (state.rendition && state.rendition.manager) {
      try { state.rendition.resize(); } catch (e) {}
    }
  }

  /* ------------------------------------------------------------------ */
  /* PDF                                                                 */
  /* ------------------------------------------------------------------ */

  async function setupPdfWorker() {
    var src = await readText('pdfworker.js');
    var blob = new Blob([src], { type: 'text/javascript' });
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
  }

  async function loadPdf(opts) {
    await setupPdfWorker();
    var data = await readBinary(opts.url, true);
    loading('rendering');
    var doc = await pdfjsLib.getDocument({ data: data, isEvalSupported: false }).promise;
    state.pdf = doc;

    var container = document.getElementById('pages');
    container.style.display = 'block';
    container.innerHTML = '';
    state.pdfPages = [];

    for (var i = 1; i <= doc.numPages; i++) {
      var page = document.createElement('div');
      page.className = 'page';
      page.dataset.page = String(i);
      var canvas = document.createElement('canvas');
      page.appendChild(canvas);
      container.appendChild(page);
      state.pdfPages.push(page);
    }

    applyPdfTheme();

    var start = 1;
    if (opts.location) start = Math.max(1, Math.min(doc.numPages, parseInt(opts.location, 10) || 1));
    else if (opts.percent) start = Math.max(1, Math.round(opts.percent * doc.numPages));

    var outline = [];
    try {
      var raw = await doc.getOutline();
      outline = await flattenPdfOutline(doc, raw || [], 0, []);
    } catch (e) {}
    state.chapters = outline;

    goToPdfPage(start, false, true);
    await renderAround(start);
    if (disposed || fatalError) return;
    state.opened = true;
    post({ type: 'loaded', kind: 'pdf', pageCount: doc.numPages, chapters: outline });
    reportPdfLocation();
    setStatus('', true);
    document.getElementById('status').classList.remove('on');

    container.addEventListener('scroll', onPdfScroll, { passive: true });
  }

  async function flattenPdfOutline(doc, items, depth, out) {
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var page = null;
      try {
        var dest = typeof item.dest === 'string' ? await doc.getDestination(item.dest) : item.dest;
        if (dest && dest[0]) {
          var index = await doc.getPageIndex(dest[0]);
          page = index + 1;
        }
      } catch (e) {}
      out.push({ label: item.title, href: page ? String(page) : null, depth: depth });
      if (item.items && item.items.length) await flattenPdfOutline(doc, item.items, depth + 1, out);
    }
    return out;
  }

  function applyPdfTheme() {
    var dim = state.theme.dimPages;
    state.pdfPages.forEach(function (p) { p.classList.toggle('dim', !!dim); });
    document.getElementById('pages').classList.toggle('scroll', state.settings.flow === 'scrolled');
  }

  var renderQueue = {};
  async function renderPage(n) {
    if (n < 1 || n > state.pdf.numPages) return;
    var el = state.pdfPages[n - 1];
    var key = n + ':' + Math.round(window.innerWidth) + ':' + (state.settings.flow || 'paged');
    if (state.rendered[n] === key || renderQueue[n]) return;
    renderQueue[n] = true;

    try {
      var page = await state.pdf.getPage(n);
      var canvas = el.querySelector('canvas');
      var ctx = canvas.getContext('2d', { alpha: false });
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);

      var base = page.getViewport({ scale: 1 });
      var availW = el.clientWidth - 20;
      var availH = state.settings.flow === 'scrolled'
        ? (availW / base.width) * base.height
        : el.clientHeight - 16;
      var scale = Math.min(availW / base.width, availH / base.height);
      var viewport = page.getViewport({ scale: scale * dpr });

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
      canvas.style.height = Math.floor(viewport.height / dpr) + 'px';

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      state.rendered[n] = key;
    } catch (e) {
      // A single unrenderable page shouldn't take the whole book down.
    } finally {
      renderQueue[n] = false;
    }
  }

  var KEEP_WINDOW = 3;

  async function renderAround(n) {
    if (state.kind === 'comic') {
      // Prune before waiting; a slow page must not keep old decoded images alive.
      for (var i = 1; i <= state.pdfPages.length; i++) {
        if (Math.abs(i - state.pdfPage) > KEEP_WINDOW) releaseComicPage(i);
      }
      await renderComicPage(n);
      if (n !== state.pdfPage || disposed || fatalError) return;
      renderComicPage(n + 1);
      renderComicPage(n - 1);
      renderComicPage(n + 2);
      return;
    }
    await renderPage(n);
    renderPage(n + 1);
    renderPage(n - 1);
    renderPage(n + 2);
  }

  var scrollTimer = null;
  function onPdfScroll() {
    if (scrollTimer) return;
    scrollTimer = setTimeout(function () {
      scrollTimer = null;
      var container = document.getElementById('pages');
      var n;
      if (state.settings.flow === 'scrolled') {
        var mid = container.scrollTop + container.clientHeight / 2;
        n = 1;
        for (var i = 0; i < state.pdfPages.length; i++) {
          var p = state.pdfPages[i];
          if (p.offsetTop <= mid) n = i + 1; else break;
        }
      } else {
        n = Math.round(container.scrollLeft / container.clientWidth) + 1;
      }
      var totalPages = state.kind === 'comic' ? state.pageCount : state.pdf.numPages;
      n = Math.max(1, Math.min(totalPages, n));
      if (n !== state.pdfPage) {
        state.pdfPage = n;
        resetZoom(false);
        renderAround(n);
      }
      reportPdfLocation();
    }, 90);
  }

  function reportPdfLocation() {
    if (!state.opened) return;
    var total = state.kind === 'comic' ? state.pageCount : state.pdf ? state.pdf.numPages : 1;
    var percent = total > 1 ? (state.pdfPage - 1) / (total - 1) : 1;
    state.lastPercent = percent;
    state.lastLocation = String(state.pdfPage);
    post({
      type: 'location',
      percent: percent,
      location: String(state.pdfPage),
      page: state.pdfPage,
      pageCount: total,
      atStart: state.pdfPage <= 1,
      atEnd: state.pdfPage >= total,
    });
  }

  function goToPdfPage(n, smooth, opening) {
    if (!state.pdfPages.length) return;
    var container = document.getElementById('pages');
    var total = state.kind === 'comic' ? state.pageCount : state.pdf.numPages;
    n = Math.max(1, Math.min(total, n));
    state.pdfPage = n;
    var el = state.pdfPages[n - 1];
    if (state.settings.flow === 'scrolled') {
      container.scrollTo({ top: el.offsetTop, behavior: smooth ? 'smooth' : 'auto' });
    } else {
      container.scrollTo({ left: (n - 1) * container.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
    }
    if (!opening) renderAround(n);
    reportPdfLocation();
  }

  /* ------------------------------------------------------------------ */
  /* Comics (CBZ + CBR)                                                  */
  /* ------------------------------------------------------------------ */

  /** "page2" must sort before "page10", which a plain string sort gets wrong. */
  function naturalCompare(a, b) {
    var re = /(\d+)|(\D+)/g;
    var ax = String(a).toLowerCase().match(re) || [];
    var bx = String(b).toLowerCase().match(re) || [];
    while (ax.length && bx.length) {
      var an = ax.shift(), bn = bx.shift();
      var ai = parseInt(an, 10), bi = parseInt(bn, 10);
      if (!isNaN(ai) && !isNaN(bi)) {
        if (ai !== bi) return ai - bi;
      } else if (an !== bn) {
        return an < bn ? -1 : 1;
      }
    }
    return ax.length - bx.length;
  }

  var IMAGE_RE = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;

  function isComicImage(path) {
    if (path.indexOf('__MACOSX/') !== -1) return false;      // macOS resource forks
    if (path.split('/').pop().charAt(0) === '.') return false; // .DS_Store and friends
    return IMAGE_RE.test(path);
  }

  function mimeFor(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    if (ext === 'png') return 'image/png';
    if (ext === 'gif') return 'image/gif';
    if (ext === 'webp') return 'image/webp';
    if (ext === 'avif') return 'image/avif';
    if (ext === 'bmp') return 'image/bmp';
    return 'image/jpeg';
  }

  /** CBZ: a plain ZIP, read with the same JSZip the epub reader uses. */
  async function zipEntries(data) {
    var zip = await JSZip.loadAsync(data);
    var out = [];
    zip.forEach(function (path, file) {
      if (file.dir || !isComicImage(path)) return;
      out.push({
        name: file.name,
        read: function () { return file.async('blob'); },
      });
    });
    return out;
  }

  /** CBR pages arrive from one sequential extraction, never one archive scan per page. */
  async function rarEntries(data) {
    if (typeof Worker === 'undefined') {
      throw new Error('This browser cannot unpack CBR comics in the background. Try a CBZ copy or a newer browser.');
    }
    var assets = await Promise.all([readText('unrar.js'), readText('comic-worker.js'), readBinary('unrar.wasm')]);
    if (disposed) throw new Error('Opening cancelled.');
    comicWorkerUrl = URL.createObjectURL(new Blob([assets[0], '\n', assets[1]], { type: 'text/javascript' }));
    try { comicWorker = new Worker(comicWorkerUrl); }
    catch (error) {
      stopComicWorker();
      throw new Error('The background comic decoder could not start. Please try again, or use a CBZ copy.');
    }
    return new Promise(function (resolve, reject) {
      var records = new Map();
      var listed = false;
      var ended = false;
      function failed(message) {
        if (ended || disposed) return;
        ended = true;
        var error = new Error(message);
        records.forEach(function (record) {
          record.error = error;
          record.waiters.forEach(function (waiter) { waiter.reject(error); });
          record.waiters = [];
        });
        stopComicWorker();
        if (listed) fail(message);
        else reject(error);
      }
      comicWorker.onerror = function (event) {
        event.preventDefault();
        failed('The comic decoder stopped unexpectedly. Try again, or try a smaller CBZ copy.');
      };
      comicWorker.onmessageerror = function () { failed('The comic decoder could not send a page. Please try again.'); };
      comicWorker.onmessage = function (event) {
        if (disposed || ended) return;
        var message = event.data;
        if (message.type === 'entries') {
          listed = true;
          resolve(message.names.map(function (name) {
            var record = { blob: null, error: null, waiters: [] };
            records.set(name, record);
            return {
              name: name,
              read: function () {
                if (record.error) return Promise.reject(record.error);
                if (record.blob) return Promise.resolve(record.blob);
                return new Promise(function (resolvePage, rejectPage) {
                  record.waiters.push({ resolve: resolvePage, reject: rejectPage });
                });
              },
            };
          }));
        } else if (message.type === 'page') {
          var record = records.get(message.name);
          if (!record) { failed('The comic contains an unexpected page. Try another copy.'); return; }
          // Keep encoded images, not decoded bitmaps; only the nearby pages become <img>s.
          record.blob = new Blob([message.data], { type: mimeFor(message.name) });
          record.waiters.forEach(function (waiter) { waiter.resolve(record.blob); });
          record.waiters = [];
        } else if (message.type === 'progress') {
          loading('unpacking', { completed: message.completed, total: message.total, fraction: message.completed / message.total });
        } else if (message.type === 'done') {
          ended = true;
          stopComicWorker();
        } else if (message.type === 'error') failed(message.message);
      };
      try { comicWorker.postMessage({ data: data, wasmBinary: assets[2] }, [data, assets[2]]); }
      catch (error) { failed('The comic could not be sent to the background decoder. Please try again.'); }
    });
  }

  async function loadComic(opts) {
    var data = await readBinary(opts.url, true);
    loading('unpacking');

    // RAR archives start with "Rar!"; trust the bytes over the file extension.
    var head = new Uint8Array(data.slice(0, 4));
    var isRar = head[0] === 0x52 && head[1] === 0x61 && head[2] === 0x72 && head[3] === 0x21;

    var entries = isRar ? await rarEntries(data) : await zipEntries(data);
    data = null;

    entries.sort(function (a, b) { return naturalCompare(a.name, b.name); });
    if (!entries.length) throw new Error('No images found in this comic archive.');

    // Manga reads right-to-left; reversing the order lets the same paging work.
    if (state.settings.rtl) entries.reverse();
    state.comicEntries = entries;
    state.pageCount = entries.length;

    var container = document.getElementById('pages');
    container.style.display = 'block';
    container.innerHTML = '';
    state.pdfPages = [];

    for (var i = 0; i < entries.length; i++) {
      var page = document.createElement('div');
      page.className = 'page comic';
      page.dataset.page = String(i + 1);
      var img = document.createElement('img');
      img.alt = 'Comic page ' + (i + 1);
      img.style.display = 'none';
      page.appendChild(img);
      var notice = document.createElement('div');
      notice.className = 'page-notice';
      notice.textContent = 'Preparing page…';
      notice.setAttribute('role', 'status');
      page.appendChild(notice);
      container.appendChild(page);
      state.pdfPages.push(page);
    }

    applyPdfTheme();

    var start = 1;
    if (opts.location) start = Math.max(1, Math.min(entries.length, parseInt(opts.location, 10) || 1));
    else if (opts.percent) start = Math.max(1, Math.round(opts.percent * entries.length));

    goToPdfPage(start, false, true);
    await renderAround(start);
    if (disposed || fatalError) return;
    state.opened = true;
    post({ type: 'loaded', kind: 'comic', pageCount: entries.length, chapters: [] });
    reportPdfLocation();
    setStatus('', true);
    document.getElementById('status').classList.remove('on');

    container.addEventListener('scroll', onPdfScroll, { passive: true });
  }

  /** Share in-flight work, including image decoding, so loaded never means a blank page. */
  function renderComicPage(n) {
    if (n < 1 || n > state.comicEntries.length) return Promise.resolve();
    var el = state.pdfPages[n - 1];
    if (el.pending) return el.pending;
    if (el.dataset.loaded === '1') return Promise.resolve();
    var entry = state.comicEntries[n - 1];
    var img = el.querySelector('img');
    var notice = el.querySelector('.page-notice');
    notice.style.display = '';
    notice.textContent = 'Preparing page…';
    el.pending = (async function () {
      try {
        var blob = await entry.read();
        // Navigation or RTL may have moved this element while its page was unpacking.
        var index = state.pdfPages.indexOf(el) + 1;
        if (disposed || fatalError || Math.abs(index - state.pdfPage) > KEEP_WINDOW) return;
        if (!state.opened && index === state.pdfPage) loading('rendering');
        var url = URL.createObjectURL(blob);
        el.dataset.url = url;
        await new Promise(function (resolve, reject) {
          img.onload = resolve;
          img.onerror = function () { reject(new Error('The page image could not be displayed.')); };
          img.src = url;
        });
        el.dataset.loaded = '1';
        img.style.display = '';
        notice.style.display = 'none';
        index = state.pdfPages.indexOf(el) + 1;
        if (disposed || Math.abs(index - state.pdfPage) > KEEP_WINDOW) releaseComicPage(index);
      } catch (error) {
        if (el.dataset.url) URL.revokeObjectURL(el.dataset.url);
        delete el.dataset.url;
        img.removeAttribute('src');
        img.style.display = 'none';
        notice.textContent = 'This page couldn’t be displayed. You can still turn to the next page.';
      } finally {
        img.onload = null;
        img.onerror = null;
        el.pending = null;
      }
    })();
    return el.pending;
  }

  function releaseComicPage(n) {
    if (n < 1 || n > state.pdfPages.length) return;
    var el = state.pdfPages[n - 1];
    if (!el || el.dataset.loaded !== '1') return;
    try { URL.revokeObjectURL(el.dataset.url); } catch (e) {}
    el.querySelector('img').removeAttribute('src');
    el.querySelector('img').style.display = 'none';
    delete el.dataset.url;
    el.dataset.loaded = '0';
    el.querySelector('.page-notice').style.display = '';
  }

  /* ------------------------------------------------------------------ */
  /* Pinch zoom (comics + PDF)                                           */
  /* ------------------------------------------------------------------ */

  var MAX_SCALE = 5;
  var zoom = { scale: 1, tx: 0, ty: 0 };

  function zoomTarget() {
    var el = state.pdfPages[state.pdfPage - 1];
    return el ? el.querySelector('img, canvas') : null;
  }

  function applyZoom(animate) {
    var el = zoomTarget();
    if (!el) return;
    el.style.transition = animate ? 'transform 180ms ease-out' : '';
    el.style.transform =
      'translate(' + zoom.tx + 'px,' + zoom.ty + 'px) scale(' + zoom.scale + ')';
    document.getElementById('pages').classList.toggle('zoomed', zoom.scale > 1.01);
  }

  function resetZoom(animate) {
    var el = zoomTarget();
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    if (el) applyZoom(animate);
    document.getElementById('pages').classList.remove('zoomed');
  }

  /** Keep the image overlapping the viewport rather than drifting off-screen. */
  function clampPan() {
    var el = zoomTarget();
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var overX = Math.max(0, (rect.width - window.innerWidth) / 2);
    var overY = Math.max(0, (rect.height - window.innerHeight) / 2);
    zoom.tx = Math.max(-overX, Math.min(overX, zoom.tx));
    zoom.ty = Math.max(-overY, Math.min(overY, zoom.ty));
  }

  function distance(a, b) {
    var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function attachZoom(container) {
    var startDist = 0, startScale = 1, panX = 0, panY = 0, startTx = 0, startTy = 0;
    var pinching = false, panning = false;

    container.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        pinching = true;
        panning = false;
        startDist = distance(e.touches[0], e.touches[1]);
        startScale = zoom.scale;
      } else if (e.touches.length === 1 && zoom.scale > 1.01) {
        panning = true;
        panX = e.touches[0].clientX;
        panY = e.touches[0].clientY;
        startTx = zoom.tx;
        startTy = zoom.ty;
      }
    }, { passive: true });

    container.addEventListener('touchmove', function (e) {
      if (pinching && e.touches.length === 2) {
        var d = distance(e.touches[0], e.touches[1]);
        if (startDist > 0) {
          zoom.scale = Math.max(1, Math.min(MAX_SCALE, startScale * (d / startDist)));
          if (zoom.scale <= 1.01) { zoom.tx = 0; zoom.ty = 0; }
          clampPan();
          applyZoom(false);
        }
        if (e.cancelable) e.preventDefault();
      } else if (panning && e.touches.length === 1) {
        zoom.tx = startTx + (e.touches[0].clientX - panX);
        zoom.ty = startTy + (e.touches[0].clientY - panY);
        clampPan();
        applyZoom(false);
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', function (e) {
      if (e.touches.length === 0) {
        // Snap back rather than leaving the page fractionally scaled.
        if (zoom.scale < 1.05) resetZoom(true);
        pinching = false;
        panning = false;
      }
    }, { passive: true });
  }

  /* ------------------------------------------------------------------ */
  /* Command surface (called from React Native)                          */
  /* ------------------------------------------------------------------ */

  function turn(direction) {
    if (zoom.scale > 1.01) resetZoom(false);
    // A page still easing into place would leave the turn half a page out.
    settlePageDrag();
    if (state.kind === 'epub' && state.rendition) {
      direction > 0 ? state.rendition.next() : state.rendition.prev();
    } else if ((state.kind === 'pdf' && state.pdf) || state.kind === 'comic') {
      goToPdfPage(state.pdfPage + direction, true);
    }
  }

  window.JS = {
    load: function (opts) {
      managedLoading = !!opts.managedLoading;
      state.kind = opts.kind;
      state.settings = opts.settings || {};
      state.theme = opts.theme || {};
      applyRootTheme();
      setStatus(managedLoading ? '' : 'Opening…', true);
      var run =
        opts.kind === 'pdf' ? loadPdf(opts) :
        opts.kind === 'comic' ? loadComic(opts) :
        loadEpub(opts);
      return run.catch(function (e) {
        if (!disposed) fail(e && e.message ? e.message : 'This book could not be opened.');
      });
    },

    dispose: disposeReader,
    next: function () { turn(1); },
    prev: function () { turn(-1); },

    goTo: function (location) {
      settlePageDrag();
      if (state.kind === 'epub' && state.rendition) {
        state.rendition.display(location).catch(function (e) {
          post({ type: 'log', message: 'goTo ' + location + ' failed: ' + (e && e.message ? e.message : e) });
        });
      }
      else if (state.kind === 'pdf' || state.kind === 'comic') {
        goToPdfPage(parseInt(location, 10) || 1, false);
      }
    },

    goToPercent: function (p) {
      settlePageDrag();
      if (state.kind === 'epub' && state.rendition) {
        if (state.locationsReady) {
          var cfi = state.book.locations.cfiFromPercentage(p);
          if (cfi) state.rendition.display(cfi);
        }
      } else if (state.kind === 'pdf' && state.pdf) {
        goToPdfPage(Math.max(1, Math.round(p * state.pdf.numPages)), false);
      } else if (state.kind === 'comic') {
        goToPdfPage(Math.max(1, Math.round(p * state.pageCount)), false);
      }
    },

    setSettings: function (settings) {
      var wasRtl = !!state.settings.rtl;
      state.settings = Object.assign({}, state.settings, settings);
      if (state.kind === 'epub') {
        applyEpubStyle();
        setMargins();
      } else if (state.kind === 'pdf' && state.pdf) {
        state.rendered = {};
        applyPdfTheme();
        requestAnimationFrame(function () { goToPdfPage(state.pdfPage, false); });
      } else if (state.kind === 'comic' && state.pageCount) {
        if (wasRtl !== !!state.settings.rtl) {
          resetZoom(false);
          state.comicEntries.reverse();
          state.pdfPages.reverse();
          state.pdfPage = state.pageCount + 1 - state.pdfPage;
          var container = document.getElementById('pages');
          state.pdfPages.forEach(function (page, index) {
            page.dataset.page = String(index + 1);
            page.querySelector('img').alt = 'Comic page ' + (index + 1);
            container.appendChild(page);
          });
        }
        applyPdfTheme();
        requestAnimationFrame(function () { goToPdfPage(state.pdfPage, false); });
      }
    },

    setTheme: function (theme) {
      var wasDark = !!state.theme.dark;
      state.theme = Object.assign({}, state.theme, theme);
      applyRootTheme();
      if (state.kind === 'epub') {
        applyEpubStyle();
        // The blend mode is baked into each mark, so a light/dark switch redraws them.
        if (wasDark !== !!state.theme.dark) redrawHighlights();
      } else applyPdfTheme();
    },

    highlight: function (id, cfi, color) {
      if (state.kind !== 'epub' || !state.rendition) return;
      state.highlights[cfi] = { id: id, color: color };
      drawHighlight(id, cfi, color);
    },

    unhighlight: function (cfi) {
      if (state.kind !== 'epub' || !state.rendition) return;
      delete state.highlights[cfi];
      try { state.rendition.annotations.remove(cfi, 'highlight'); } catch (e) {}
    },

    /* A menu item was chosen for the selection. The host can't read the
       selection itself (the native menu's selectedText is empty for text
       inside an iframe), so this answers with the text and CFI to act on. */
    selectionAction: function (action) {
      var selection = currentSelection() || state.lastSelection;
      if (!selection) {
        post({ type: 'log', message: 'selectionAction ' + action + ': nothing is selected' });
        return;
      }
      post({ type: 'selectionAction', action: action, text: selection.text, location: selection.location });
    },

    clearSelection: function () {
      state.lastSelection = null;
      try {
        if (state.rendition) {
          state.rendition.getContents().forEach(function (c) {
            c.window.getSelection().removeAllRanges();
          });
        }
        window.getSelection().removeAllRanges();
      } catch (e) {}
    },

    resize: function () {
      settlePageDrag();
      if (state.kind === 'epub' && state.rendition) { try { state.rendition.resize(); } catch (e) {} }
      else if (state.kind === 'pdf' && state.pdf) {
        state.rendered = {};
        goToPdfPage(state.pdfPage, false);
      } else if (state.kind === 'comic' && state.opened) {
        // Images scale with CSS; the page just needs re-centring after rotation.
        goToPdfPage(state.pdfPage, false);
      }
    },
  };

  function applyRootTheme() {
    var t = state.theme;
    var root = document.documentElement.style;
    if (t.bg) root.setProperty('--bg', t.bg);
    if (t.fg) root.setProperty('--fg', t.fg);
    if (t.accent) root.setProperty('--accent', t.accent);
    if (state.settings.insetTop != null) root.setProperty('--top', state.settings.insetTop + 'px');
    if (state.settings.insetBottom != null) root.setProperty('--bottom', state.settings.insetBottom + 'px');
  }

  window.addEventListener('error', function (e) {
    post({ type: 'log', message: 'error: ' + (e.message || 'unknown') });
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { window.JS.resize(); }, 160);
  });

  // The container carries the safe-area padding, so taps there must count too.
  attachTaps(document, { onTurn: turn });
  attachZoom(document.getElementById('pages'));

  bindKeys(document);
  post({ type: 'ready' });
})();
</script>
</body>
</html>
